<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAZENCRAFT | A Birthday Adventure</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>

<body>

<div id="loading">
  <h1>Generating MazenCraft World...</h1>
  <div class="bar">
    <div id="progress"></div>
  </div>
  <p id="percent">0%</p>
</div>

<div id="game">
  <h1 class="title">⛏️ MAZENCRAFT ⛏️</h1>

  <div class="world">
    <div class="block grass"></div>
    <div class="block dirt"></div>
    <div class="chest">🎁</div>
  </div>

  <button onclick="openChest()">Open Chest</button>

  <p id="message"></p>
</div>

<script>
let progress = 0;

let timer = setInterval(()=>{
 progress += 10;
 document.getElementById("progress").style.width = progress+"%";
 document.getElementById("percent").innerHTML = progress+"%";

 if(progress >= 100){
   clearInterval(timer);
   document.getElementById("loading").style.display="none";
   document.getElementById("game").style.display="block";
 }
},300);

function openChest(){
 document.getElementById("message").innerHTML =
 "🎂 Happy Birthday Mazen! Welcome to your world ❤️";
}
</script>

</body>

</html>
